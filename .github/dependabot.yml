version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 10
    labels: [dependencies, security-review]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels: [dependencies, security-review]
